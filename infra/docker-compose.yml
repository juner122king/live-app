version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: live-app-postgres
    environment:
      POSTGRES_DB: live_app
      POSTGRES_USER: live
      POSTGRES_PASSWORD: live123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  srs:
    image: ossrs/srs:5
    container_name: live-app-srs
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8088:8080"
    volumes:
      - ../srs-server/conf/srs.conf:/usr/local/srs/conf/srs.conf:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: live-app-nginx
    depends_on:
      - srs
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres-data:
