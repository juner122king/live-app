server:
  port: 8081

spring:
  application:
    name: live-api
  datasource:
    url: jdbc:postgresql://localhost:5432/live_app
    username: live
    password: live123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  rtmp-base-url: ${LIVE_RTMP_BASE_URL:rtmp://192.168.112.150:1935/live}
  hls-base-url: ${LIVE_HLS_BASE_URL:http://192.168.112.150:8080/live}
